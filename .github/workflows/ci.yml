name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - e4l-runtime-hardening
  pull_request:
    branches:
      - e4l-runtime-hardening

jobs:
  test:
    name: pytest (Python 3.11, ubuntu-latest)
    runs-on: ubuntu-latest

    env:
      # Vault password used by the daemon; tests run against a dummy vault so
      # any non-empty value satisfies the module without touching real secrets.
      CATO_VAULT_PASSWORD: ${{ secrets.CATO_VAULT_PASSWORD || 'testpassword123' }}
      # Prevent sentence-transformers / torch from phoning home during tests.
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short
