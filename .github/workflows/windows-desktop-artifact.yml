name: Windows desktop artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [e4l-runtime-hardening]
  push:
    branches: [e4l-runtime-hardening]

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows desktop
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      VITE_CATO_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install daemon and bundling dependencies
        run: python -m pip install ".[dev,bundle]"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Resolve artifact identity
        id: identity
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "VITE_CATO_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Validate artifact custody contract
        run: python desktop/scripts/validate_artifact_custody.py
      - name: Lint desktop
        working-directory: desktop
        run: npm run lint
      - name: Build signed-independent NSIS installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - name: Stage installer and checksums
        id: stage
        shell: pwsh
        run: |
          $name = "Cato-v${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.short_sha }}"
          $out = Join-Path $PWD "artifacts/$name"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installers = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if ($installers.Count -eq 0) { throw "Tauri produced no NSIS installer" }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $out "$name-setup.exe")
          }
          Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii (Join-Path $out "SHA256SUMS.txt")
          "path=$out" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload versioned installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: 30
