name: Python Verify

# Runs on push/PR to e4l-runtime-hardening (Windows pytest + wheel check),
# plus manual workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - e4l-runtime-hardening
  pull_request:
    branches:
      - e4l-runtime-hardening

jobs:
  verify:
    runs-on: windows-latest
    env:
      # Same contract as ci.yml — tests that reach a real start path need a
      # non-empty unlock secret (dummy is fine; never a production password).
      CATO_VAULT_PASSWORD: ${{ secrets.CATO_VAULT_PASSWORD || 'testpassword123' }}
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install .[dev]

      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short

      - name: Verify Python source and built wheel
        run: python scripts/verify_python_build.py --skip-pytest
